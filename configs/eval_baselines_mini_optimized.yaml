suite:
  family: android_world
  rounds: 5
  seed: 30
  use_androidworld_step_budget: true

model_config: model_qwen25vl_7b_remote_optimized.yaml
runtime_config: runtime_windows.yaml

pa_lite:
  engineering_optimization: true
  planner_max_cycles: 6
  control_turn_limit: 36
  planner_max_subtasks: 5
  actor_local_step_guard: 8
  post_action_wait_seconds: 0.5
  source_notes:
    planner_max_cycles: "Engineering instantiation for this 7B reproduction; the DMS paper names Max_P but does not report a fixed value."
    control_turn_limit: "Bounds planner calls and non-environment control outputs after separating them from AndroidWorld actions."
    planner_max_subtasks: "DMS paper Section 3.1 specifies k <= 5."
    actor_local_step_guard: "Runtime guard for a sub-task; the paper names Max_A but does not report a fixed value."

baseline_a_zero_shot:
  memory: none

baseline_b_static_memory:
  memory: chronological_append_only
  max_context_entries: 12

dms:
  memory: hierarchical_external_backend
  memory_backend: dms.darwinian_memory:build_darwinian_memory_backend
  memory_kwargs:
    embedding_model_path: ../model_cache/modelscope/AI-ModelScope/all-MiniLM-L6-v2
    epsilon: 0.1
    novelty_bonus: 1.0
    base_retention: 30.0
    longevity_coefficient: 15.0
    decay_steepness: 0.5
    penalty_coefficient: 1.0
    threshold_sensitivity: 0.3
    verification_limit: 3
    min_capacity: 24
    max_capacity: 96
    min_retrieval_score: 0.25
    min_component_similarity: 0.35
    min_goal_similarity: 0.55
