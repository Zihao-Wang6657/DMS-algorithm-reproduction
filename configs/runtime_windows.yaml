paths:
  workspace: ..
  android_world_src: ../third_party/android_world
  android_sdk: "%LOCALAPPDATA%/Android/Sdk"
  android_avd_home: "%USERPROFILE%/.android/avd"
  java_home: "C:/Program Files/Android/Android Studio/jbr"
  conda_env: "%USERPROFILE%/anaconda3/envs/android_world"

android:
  avd_name: AndroidWorldAvd
  a11y_method: uiautomator
  tmux_session: null
  console_port: 5554
  grpc_port: 8554
  adb_path: "%LOCALAPPDATA%/Android/Sdk/platform-tools/adb.exe"
  emulator_path: "%LOCALAPPDATA%/Android/Sdk/emulator/emulator.exe"
  accessibility_forwarder_apk: ../downloads/accessibility_forwarder.apk

runtime:
  cuda_visible_devices: "0"
  hf_home: ../model_cache/huggingface
  offline: false
  task_step_budget_source: androidworld_complexity_times_10
