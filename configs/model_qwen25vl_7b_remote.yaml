model:
  name: Qwen/Qwen2.5-VL-7B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa
  min_pixels: 200704
  max_pixels: 1003520
  max_new_tokens: 192
  do_sample: false

runtime:
  backend: openai_compatible
  base_url: http://127.0.0.1:8000/v1
  request_timeout_seconds: 300
  # Disable hidden per-request retries so every API interruption is auditable.
  max_retries: 0
  retry_backoff_seconds: 2
  verify_tls: true
  api_key_env: DMS_MODEL_API_KEY
  # The OpenAI-compatible response does not expose PyTorch allocator stats.
  # A zero here means "not reported"; token metrics still come from API usage.
  reported_peak_gpu_memory_gib: 0.0

generation:
  temperature: null
  top_p: null

source_notes:
  model_choice: "Same Qwen2.5-VL-7B-Instruct model as the local reproduction config."
  decoding: "Same deterministic decoding and 192-token output cap as the local client."
  transport: "Infrastructure-only OpenAI-compatible transport over an SSH local forward; each HTTP response closes its connection to prevent stale keep-alive reuse."
